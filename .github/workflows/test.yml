name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
        env:
          AI_API_KEY: 'sk-test-key'
          AI_PROVIDER: 'openai'
          AI_MODEL: 'gpt-4-turbo'

      - name: Integration tests
        run: npm run test:integration
        env:
          AI_API_KEY: 'sk-test-key'
          AI_PROVIDER: 'openai'
          AI_MODEL: 'gpt-4-turbo'

      - name: Build
        run: npm run build
